name: Daily US Stock Quant Update & Verify

on:
  schedule:
    - cron: '0 22 * * 1-5'  # 每週一至週五 UTC 時間 22:00（美股收盤後兩小時）自動觸發
  workflow_dispatch:        # 允許您在網頁隨時手動點擊執行測試

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install --upgrade pip
          pip install pandas yfinance

      - name: 執行每日一鍵更新與聚合程序
        run: python tools/run_daily_routine.py
