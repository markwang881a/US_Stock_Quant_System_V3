name: Daily US Stock Quant Update & Verify

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4  # 升級至 v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5  # 升級至 v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install --upgrade pip
          pip install pandas yfinance

      - name: 執行每日一鍵更新與聚合程序
        run: python tools/run_daily_routine.py
